version: 2
updates:
  # GitHub Actions are pinned to commit SHAs; Dependabot keeps the SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [chore, "area: build"]
    milestone: 3

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [chore, "area: build"]
    milestone: 3
    groups:
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [chore, "area: build"]
    milestone: 3
    groups:
      npm-minor:
        update-types: [minor, patch]
