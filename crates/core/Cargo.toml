[package]
name = "trama-core"
description = "Trama core library: capture, transcription, curator, index and storage, independent of the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fs4 = "1.1"
rusqlite = { version = "0.43", features = ["bundled"] }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
thiserror = "2"
unic-langid = { version = "0.9", features = ["macros"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1.29", features = ["v7"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
cpal = "0.18"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
screencapturekit = { version = "12", optional = true }

[features]
# ScreenCaptureKit fallback for system audio, used only when the Core Audio process tap
# cannot be created. Off by default: it links a Swift bridge (see build.rs).
screencapturekit = ["dep:screencapturekit"]

[lints]
workspace = true

[dev-dependencies]
fluent-syntax = "0.12"
tempfile = "3"
