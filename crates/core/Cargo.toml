[package]
name = "trama-core"
description = "Trama core library: capture, transcription, curator, index and storage, independent of the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fs4 = "1.1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
thiserror = "2"
unic-langid = { version = "0.9", features = ["macros"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1.29", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
fluent-syntax = "0.12"
tempfile = "3"
