[package]
name = "trama-desktop"
description = "Trama desktop app: Tauri shell over the core library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "trama_desktop"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
fluent-bundle = "0.16"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.7", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
trama-core.workspace = true

# The Dock icon that follows the accent (see `dock_icon.rs`): already in the tree through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[lints]
workspace = true

[dev-dependencies]
muda = { version = "0.20", default-features = false }
serde_json = "1"
tempfile = "3"
